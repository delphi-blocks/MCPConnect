# Prometheus for the MCPServerMetrics demo: scrapes the metrics the OTel
# collector (otel-collector.yaml) exposes on 8889.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Keep the job/instance the collector derives from the resource
    # (service.name -> job) instead of overwriting them with this scrape's.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
